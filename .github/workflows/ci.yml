name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs run on GitHub's hosted xcode-27 image (macOS 27, public preview), the only hosted image with the iOS 27
# SDKs and the iPhone Duo simulator. Xcode 27.2 carries the iOS 27.2 SDK, the version the Duo runs; on this image it is
# a release candidate. The image's Duo simulator is iOS 27.1, which is why project.yml targets iOS 27.1.
jobs:
  core-tests:
    name: VellumCore tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run the VellumCore tests
        run: swift test --package-path apps/ios

  simulator-build:
    name: iOS simulator build (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain and the Duo simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i duo || echo "No iPhone Duo simulator on this image"
      - name: Generate the project and build the unsigned simulator app
        run: sh apps/ios/Scripts/build-simulator.sh
      # PR builds have no Dropbox app key (ADR-0013): the app carries Config/Vellum.xcconfig's placeholder and says so.
      - name: Check the build carries the Dropbox placeholder, not a key
        run: |
          plist=apps/ios/.build-native/Build/Products/Debug-iphonesimulator/Vellum.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :DropboxAppKey' "$plist")" = not-set-up
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = db-not-set-up
          echo "DropboxAppKey = not-set-up, callback scheme db-not-set-up"
      # A local build takes its key from the gitignored Secrets.xcconfig, and a command-line key (testflight.sh) beats
      # it. Both keys here are made up.
      - name: Check a local Secrets.xcconfig sets the Dropbox key and the command line overrides it
        working-directory: apps/ios
        run: |
          # expect WANT CONFIGURATION [OVERRIDE...]: the app target's DROPBOX_APP_KEY in that configuration is WANT.
          expect() {
            got=$(xcodebuild -project Vellum.xcodeproj -target Vellum -configuration "$2" -showBuildSettings "${@:3}" |
              awk '!found && $1 == "DROPBOX_APP_KEY" { print $3; found = 1 }')
            echo "$2 ${*:3}: DROPBOX_APP_KEY = $got"
            test "$got" = "$1"
          }
          expect not-set-up Debug
          trap 'rm -f Secrets.xcconfig' EXIT
          echo 'DROPBOX_APP_KEY = localkey0000000' > Secrets.xcconfig
          expect localkey0000000 Debug
          expect localkey0000000 Release
          expect commandline0000 Release DROPBOX_APP_KEY=commandline0000
      # The TestFlight workflow numbers its builds with this script; printing one here proves its format on macOS.
      - name: Print a TestFlight build number
        run: |
          BUILD_NUMBER=$(sh apps/ios/Scripts/build-number.sh)
          echo "Build number: $BUILD_NUMBER"
          echo "$BUILD_NUMBER" | grep -Eq '^[0-9]{8}\.[1-9][0-9]{0,5}$|^[0-9]{8}\.0$'

  # Evidence, not part of the merge bar: every tab on the iPhone Duo simulator (iOS 27.1), unfolded, in light and dark,
  # and the Home Screen with Vellum's icon.
  duo-captures:
    name: Duo simulator captures
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture every tab and the Home Screen unfolded, in light and dark
        run: sh apps/ios/Scripts/capture-duo.sh .build-captures
      # Timings are recorded and compared with docs/perf/baselines, warning at 25% worse; they never fail the build.
      - name: Compare canvas frame timings with the baseline
        if: always()
        run: |
          python3 apps/ios/Scripts/perf-compare.py canvas-rendering apps/ios/.build-captures/benchmark.json
          python3 apps/ios/Scripts/perf-compare.py canvas-rendering apps/ios/.build-captures/benchmark-release.json
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duo-captures
          path: apps/ios/.build-captures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
