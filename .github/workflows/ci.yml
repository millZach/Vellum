name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs run on GitHub's hosted xcode-27 image (macOS 27, public preview), the only hosted image with the iOS 27
# SDKs and the iPhone Duo simulator. Xcode 27.2 carries the iOS 27.2 SDK, the version the Duo runs; on this image it is
# a release candidate. The image's Duo simulator is iOS 27.1, which is why project.yml targets iOS 27.1.
jobs:
  core-tests:
    name: VellumCore tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run the VellumCore tests
        run: swift test --package-path apps/ios
      # The drawing search on a made-up 20,000-drawing index (#68): load, keystroke and full-scan times and resident
      # memory, in an optimised build as the app runs, compared with docs/perf/baselines/drawing-index.json. Timings
      # never fail the build; the search's counts are budgets in the run above.
      - name: Time the drawing search on a made-up 20,000-drawing index (Release)
        run: |
          VELLUM_PERF_OUT="$RUNNER_TEMP/drawing-index.json" swift test -c release -Xswiftc -enable-testing \
            --package-path apps/ios --filter DrawingSearchTimingTests
      - name: Compare the drawing search timings with the baseline
        if: always()
        run: python3 apps/ios/Scripts/perf-compare.py drawing-index "$RUNNER_TEMP/drawing-index.json"

  simulator-build:
    name: iOS simulator build (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain and the Duo simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i duo || echo "No iPhone Duo simulator on this image"
      - name: Generate the project and build the unsigned simulator app
        run: sh apps/ios/Scripts/build-simulator.sh
      # PR builds have no Dropbox app key (ADR-0013): the app carries Config/Vellum.xcconfig's placeholder and says so.
      - name: Check the build carries the Dropbox placeholder, not a key
        run: |
          plist=apps/ios/.build-native/Build/Products/Debug-iphonesimulator/Vellum.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :DropboxAppKey' "$plist")" = not-set-up
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$plist")" = db-not-set-up
          echo "DropboxAppKey = not-set-up, callback scheme db-not-set-up"
      # A local build takes its key from the gitignored Secrets.xcconfig, and a command-line key (testflight.sh) beats
      # it. Both keys here are made up.
      - name: Check a local Secrets.xcconfig sets the Dropbox key and the command line overrides it
        working-directory: apps/ios
        run: |
          # expect WANT CONFIGURATION [OVERRIDE...]: the app target's DROPBOX_APP_KEY in that configuration is WANT.
          expect() {
            got=$(xcodebuild -project Vellum.xcodeproj -target Vellum -configuration "$2" -showBuildSettings "${@:3}" |
              awk '!found && $1 == "DROPBOX_APP_KEY" { print $3; found = 1 }')
            echo "$2 ${*:3}: DROPBOX_APP_KEY = $got"
            test "$got" = "$1"
          }
          expect not-set-up Debug
          trap 'rm -f Secrets.xcconfig' EXIT
          echo 'DROPBOX_APP_KEY = localkey0000000' > Secrets.xcconfig
          expect localkey0000000 Debug
          expect localkey0000000 Release
          expect commandline0000 Release DROPBOX_APP_KEY=commandline0000
      # The TestFlight workflow numbers its builds with this script; printing one here proves its format on macOS.
      - name: Print a TestFlight build number
        run: |
          BUILD_NUMBER=$(sh apps/ios/Scripts/build-number.sh)
          echo "Build number: $BUILD_NUMBER"
          echo "$BUILD_NUMBER" | grep -Eq '^[0-9]{8}\.[1-9][0-9]{0,5}$|^[0-9]{8}\.0$'

  # Evidence, not part of the merge bar: every tab on the iPhone Duo simulator (iOS 27.1), unfolded, in light and dark,
  # and the Home Screen with Vellum's icon.
  duo-captures:
    name: Duo simulator captures
    runs-on: xcode-27
    # The #7 captures (snap, lasso, moved selection, text, in light and dark) pushed the job past 30 minutes, and
    # the #8 captures (measure, dimension, loupe, frame, window) take it to 34-46 minutes depending on the runner.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture every tab and the Home Screen unfolded, in light and dark, and the drawing search folded too
        run: PART=captures sh apps/ios/Scripts/capture-duo.sh .build-captures
      # Timings are recorded and compared with docs/perf/baselines (docs/perf/README.md); they never fail the build.
      - name: Compare canvas frame timings with the baseline
        if: always()
        run: python3 apps/ios/Scripts/perf-compare.py canvas-rendering apps/ios/.build-captures/benchmark.json
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duo-captures
          path: apps/ios/.build-captures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Evidence, not part of the merge bar: placing sheets (#11) on the iPhone Duo simulator, unfolded, in light and dark:
  # Add sheet's browser, page grid and confirm steps, the outline before the tap, and placed sheets measured against
  # their printed dimensions. Its own job, so the captures job stays under its hour. Since #12 it also captures the
  # sync status in each state and the airplane-mode proof on the made-up Dropbox (about 22 minutes before #12), and since
  # #40 the drawing tools: the flyout, tag, pad, angle guide, loupe naming each snap kind, and each shape.
  duo-sheet-captures:
    name: Duo sheet and sync captures
    runs-on: xcode-27
    # About 33 minutes before #40, whose 38 captures add about 16.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture placing sheets, the sync status and the drawing tools unfolded, in light and dark
        run: PART=sheets sh apps/ios/Scripts/capture-duo.sh .build-captures
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duo-sheet-captures
          path: apps/ios/.build-captures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Evidence, not part of the merge bar: the canvas benchmark in an optimised (Release, BENCHMARK) build on the iPhone
  # Duo simulator, three launches. Split from the captures job when the #8 captures took that job past its 45 minutes.
  duo-release-benchmark:
    name: Duo release benchmark
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the benchmark in a Release build
        run: PART=release-benchmark sh apps/ios/Scripts/capture-duo.sh .build-captures
      - name: Compare canvas frame timings with the baseline
        if: always()
        run: python3 apps/ios/Scripts/perf-compare.py canvas-rendering apps/ios/.build-captures/benchmark-release.json
      - name: Keep the benchmark
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duo-release-benchmark
          path: apps/ios/.build-captures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The laptop indexer (laptop/, #66) on GitHub's Windows runner, the laptop's OS: lint, its tests on made-up drawings,
  # its timings on a made-up 5,000-file Dropbox (compared with docs/perf/baselines/laptop-indexer.json, never
  # failing), and install.ps1 / uninstall.ps1 run for real against a made-up Dropbox folder.
  laptop-indexer:
    name: Laptop indexer tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the indexer and its test dependencies, pinned
        working-directory: laptop
        run: |
          python -m pip install --disable-pip-version-check --quiet --requirement requirements-test.lock
          python -m pip install --disable-pip-version-check --quiet --no-deps --editable .
          python --version
      - name: Lint
        working-directory: laptop
        run: python -m ruff check src tests scripts
      - name: Run the tests
        working-directory: laptop
        run: python -m pytest -p no:cacheprovider -rA --durations=10
      - name: Time a made-up 5,000-file Dropbox
        working-directory: laptop
        run: python scripts/bench.py --files 5000 --out "$env:RUNNER_TEMP/laptop-indexer.json"
      - name: Compare the timings with the baseline
        if: always()
        run: python apps/ios/Scripts/perf-compare.py laptop-indexer "$env:RUNNER_TEMP/laptop-indexer.json"
      - name: Keep the timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laptop-indexer-timings
          path: ${{ runner.temp }}/laptop-indexer.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install, run and uninstall on a made-up Dropbox
        run: |
          $dropbox = Join-Path $env:RUNNER_TEMP 'Made-up Dropbox'
          New-Item -ItemType Directory -Force -Path "$dropbox\Projects\Made-up Plant\PDF" | Out-Null
          python -c "import sys; sys.path.insert(0, 'laptop/tests'); from makers import title_block_pdf; from pathlib import Path; title_block_pdf(Path(sys.argv[1]), number='E-201', title='Made-up power plan', rev='A')" "$dropbox\Projects\Made-up Plant\PDF\E-201.pdf"
          laptop/scripts/install.ps1 -DropboxPath $dropbox -Python (Get-Command python).Source
          $task = Get-ScheduledTask -TaskName 'Vellum laptop indexer' -TaskPath '\Vellum\'
          "Task: $($task.TaskPath)$($task.TaskName), state $($task.State), trigger $($task.Triggers[0].CimClass.CimClassName), runs $($task.Actions[0].Execute) $($task.Actions[0].Arguments)"
          if ($task.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') { throw 'The task does not start at logon' }
          $index = Join-Path $dropbox 'Vellum\Index\index.json'
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $index) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          $log = Join-Path $env:LOCALAPPDATA 'Vellum\indexer\indexer.log'
          if (Test-Path $log) { Get-Content $log }
          if (Test-Path $index) {
            "The logon task wrote the index:"
            Get-Content $index
          } else {
            $info = Get-ScheduledTaskInfo -TaskName 'Vellum laptop indexer' -TaskPath '\Vellum\'
            throw "The task ran (last result $($info.LastTaskResult)) but no index appeared in 90 s"
          }
          laptop/scripts/uninstall.ps1 -Purge
          if (Get-ScheduledTask -TaskName 'Vellum laptop indexer' -TaskPath '\Vellum\' -ErrorAction SilentlyContinue) { throw 'The task is still registered' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Vellum\indexer')) { throw 'The indexer folder is still there' }
          if (-not (Test-Path $index)) { throw 'Uninstalling removed the index' }
          "Uninstalled: no task, no indexer folder, the index left in Dropbox\Vellum"
