# Archives the Vellum app, signs it, uploads it to TestFlight and waits until App Store Connect has processed it, so
# TestFlight can offer it to the Duo (ADR-0001). Runs on every push to main that changes the app or
# this workflow, and by hand
# (Actions > TestFlight > Run workflow, or `gh workflow run testflight.yml`); never on a pull request.
# The App Store Connect key and the team ID are repository secrets; see docs/testflight.md.
name: TestFlight

on:
  push:
    branches: [main]
    # A change to this workflow is proved by a build too.
    paths: ['apps/ios/**', '.github/workflows/testflight.yml']
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time, and a newer push waits rather than cancelling an upload already under way.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    # The same image and Xcode as ci.yml: Xcode 27.2 and the iOS 27.2 SDK, the version the Duo runs.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run the VellumCore tests
        run: swift test --package-path apps/ios
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive, sign, upload and wait for processing
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        # The build number is the upload's UTC date and time (Scripts/build-number.sh), so it rises even when an old run
        # is retried after a newer one uploaded.
        run: |
          BUILD_NUMBER=$(sh apps/ios/Scripts/build-number.sh)
          echo "Build number: $BUILD_NUMBER"
          export BUILD_NUMBER
          sh apps/ios/Scripts/testflight.sh
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
