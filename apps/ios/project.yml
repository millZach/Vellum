# XcodeGen spec for the Vellum app. Scripts/generate-project.sh turns it into Vellum.xcodeproj with the pinned XcodeGen
# version; the .xcodeproj is generated, gitignored and never edited by hand. No team is named here: the simulator build
# is unsigned, and Scripts/testflight.sh passes the team as a build setting when it archives for TestFlight.
name: Vellum
options:
  bundleIdPrefix: com.millzach
  deploymentTarget:
    # The iPhone Duo runs iOS 27.2, but the Duo simulator on GitHub's xcode-27 runner is iOS 27.1, so 27.1 is the
    # highest target the app can be proved on in the simulator.
    iOS: "27.1"
  createIntermediateGroups: true
# Config/Vellum.xcconfig holds the DROPBOX_APP_KEY placeholder and pulls in the gitignored Secrets.xcconfig when it
# exists, so a local build can carry a real key (ADR-0013, docs/dropbox.md). The setting must not also appear under
# settings below: a setting in the project file overrides the xcconfig.
configFiles:
  Debug: Config/Vellum.xcconfig
  Release: Config/Vellum.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # The build number for TestFlight comes from the workflow run (Scripts/testflight.sh); this one is for local builds.
    CURRENT_PROJECT_VERSION: "1"
packages:
  VellumCore:
    path: .
targets:
  Vellum:
    type: application
    platform: iOS
    sources:
      - Vellum
    dependencies:
      - package: VellumCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.millzach.vellum
        PRODUCT_NAME: Vellum
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the Dropbox app key and its db-<key> callback scheme, and
        # CADisableMinimumFrameDurationOnPhone, which has no INFOPLIST_KEY_ setting and lets drawing run at 120 Hz.
        INFOPLIST_FILE: Vellum/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vellum
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The Duo is used unfolded, a 951 x 669 point landscape screen; folded, portrait still has to read.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
