[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum-indexer"
version = "1.0.0"
description = "Vellum's laptop indexer: scans the laptop's Dropbox folder and keeps the drawing index in Dropbox/Vellum."
readme = "README.md"
requires-python = ">=3.12"
# Pinned. Each is permissively licensed (README, "Dependencies"); requirements.lock pins everything they pull in.
dependencies = [
    "pypdfium2==5.15.0",
    "pillow==13.0.0",
    "watchdog==7.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "ezdxf==1.4.5",
    "ruff==0.17.4",
]

[project.scripts]
vellum-indexer = "vellum_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vellum_indexer"]
known-local-folder = ["makers", "conftest", "test_incremental"]

[tool.ruff.lint.per-file-ignores]
# Made-up paths and title blocks read better on one line.
"tests/*" = ["E501", "SIM105"]
"scripts/*" = ["E501"]
