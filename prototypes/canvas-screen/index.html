<!doctype html>
<!--
  PROTOTYPE — throwaway. Never merge to main; kept as the tag prototype/canvas-screen.
  Question: what should Vellum's canvas screen look like on the iPhone Duo unfolded (951 x 669 pt)?
  Three structurally different variants of one canvas, switchable with ?variant=A|B|C and the bar at the bottom.
  The canvas itself is shared and live: Pencil (or mouse) draws, fingers pan and pinch (mouse: wheel zooms, right-drag pans).
  All drawings, folders and projects here are made up.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vellum canvas screen — prototype</title>
<style>
  :root { --ink:#1d1d1f; --mute:#6b6b70; --line:#d9d4c9; --paper:#f3efe6; --panel:rgba(252,250,246,.94); --accent:#2f5d8a;
          --red:#d6342c; --green:#1f9d55; --blue:#2563eb; --sketch:#3a3a3a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#1b1b1d; overflow:hidden; font:13px/1.3 -apple-system,system-ui,"SF Pro Text",Segoe UI,sans-serif; color:var(--ink); touch-action:none; }
  #stageWrap { position:absolute; inset:0 0 40px 0; display:flex; align-items:center; justify-content:center; }
  #stage { position:absolute; width:951px; height:669px; transform-origin:0 0; background:var(--paper); overflow:hidden; border-radius:14px; }
  #cv { position:absolute; inset:0; width:951px; height:669px; touch-action:none; }
  #chrome { position:absolute; inset:0; pointer-events:none; }
  #chrome > * , #shared > * { pointer-events:auto; }
  #shared { position:absolute; inset:0; pointer-events:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  select { font:inherit; }
  .panel { background:var(--panel); border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.08); backdrop-filter:blur(8px); }
  .ic { display:inline-flex; align-items:center; justify-content:center; }
  .on { background:#e6edf5 !important; color:var(--accent) !important; }
  .chip { display:inline-block; width:20px; height:20px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .chip.sel { box-shadow:0 0 0 2px var(--ink); }
  .primary { background:var(--accent); color:#fff; border-radius:9px; padding:7px 12px; font-weight:600; }
  .ghost { border:1px solid var(--line); border-radius:9px; padding:6px 11px; background:#fff; }
  .rec { color:var(--red); }
  /* switcher, not part of the design */
  #switcher { position:fixed; left:50%; bottom:5px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; background:#000; color:#fff;
              border-radius:20px; padding:4px 6px; font:12px system-ui; z-index:99; white-space:nowrap; max-width:98vw; }
  #switcher button { color:#fff; font-size:16px; width:30px; height:28px; border-radius:14px; background:#333; }
  #switcher .lbl { font-weight:700; }
  #switcher .st { color:#aaa; overflow:hidden; text-overflow:ellipsis; }
  /* modals */
  .scrim { position:absolute; inset:0; background:rgba(20,20,20,.28); display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  .modal { width:560px; max-height:600px; overflow:auto; background:#fffdf9; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.25); padding:16px 18px; }
  .modal h2 { font-size:17px; margin:0 0 10px; }
  .modal .row { display:flex; gap:8px; align-items:center; margin:8px 0; }
  .kind { flex:1; border:1px solid var(--line); border-radius:12px; padding:9px; text-align:left; background:#fff; }
  .kind b { display:block; font-size:13px; } .kind span { color:var(--mute); font-size:11.5px; }
  .kind.sel { border-color:var(--accent); box-shadow:0 0 0 2px #c9d9ea; }
  .list button { display:flex; width:100%; text-align:left; padding:8px 6px; border-bottom:1px solid #eee5d6; gap:10px; align-items:center; }
  .list button:hover { background:#f6f1e7; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#eee8dc; color:#555; }
  .toast { position:absolute; left:50%; transform:translateX(-50%); padding:7px 12px; border-radius:10px; background:rgba(29,29,31,.86); color:#fff; font-size:12.5px; white-space:nowrap; pointer-events:none; }
  .pop { position:absolute; display:flex; gap:4px; padding:4px; border-radius:10px; background:#1d1d1f; color:#fff; pointer-events:auto; }
  .pop button { color:#fff; padding:6px 9px; border-radius:7px; font-size:12px; } .pop button:hover { background:#3a3a3c; }
  .opts { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; padding:6px 10px; border-radius:10px; font-size:12px; pointer-events:auto; }
  .job { position:absolute; width:290px; border-radius:12px; padding:10px 12px; font-size:12.5px; pointer-events:auto; }
  .job .q { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  textarea, input[type=text], input[type=search] { font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 8px; width:100%; background:#fff; }
  [data-live] { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #textEdit { position:absolute; display:none; z-index:5; font:15px -apple-system,system-ui,sans-serif; border:1px dashed var(--accent); background:rgba(255,255,255,.85); padding:3px 5px; min-width:160px; pointer-events:auto; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="chrome"></div>
  <div id="shared"></div>
  <input id="textEdit" type="text" placeholder="Type, or write with the Pencil">
</div></div>
<div id="switcher"><button id="prev" aria-label="Previous variant">◀</button><span class="lbl" id="vlabel"></span><button id="next" aria-label="Next variant">▶</button><span class="st" id="vstate"></span></div>
<script>
"use strict";
const W = 951, H = 669;
const VARIANTS = { A: 'Drafting rail', B: 'Pen palette', C: 'Ribbon + sheet set' };
const COLORS = { red:'#d6342c', green:'#1f9d55', blue:'#2563eb', sketch:'#3a3a3a' };
const COLOR_MEANING = { red:'Add', green:'Delete', blue:'Note', sketch:'Sketch' };
const SCALES = [ ['1/8" = 1\'-0"',96], ['3/16" = 1\'-0"',64], ['1/4" = 1\'-0"',48], ['3/8" = 1\'-0"',32], ['1/2" = 1\'-0"',24], ['3/4" = 1\'-0"',16],
                 ['1" = 1\'-0"',12], ['1-1/2" = 1\'-0"',8], ['3" = 1\'-0"',4], ['1" = 10\'',120], ['1" = 20\'',240], ['1" = 50\'',600], ['Full size 1:1',1] ];
const PAPERS = { '11×17':[17,11], '24×36':[36,24], '30×42':[42,30], '8.5×11':[11,8.5] };
const scaleLabel = k => (SCALES.find(s => s[1] === k) || ['1:' + k])[0];

// ---------- made-up drawing index ----------
const INDEX = [
  { num:'P-101', title:'Feedwater P&ID', rev:'2', scale:48, scaleText:'1/4" = 1\'-0"', proj:'Riverside Plant (example)', pdf:true,  kind:'pid',   pw:36, ph:24 },
  { num:'P-102', title:'Steam drum P&ID', rev:'0', scale:null, scaleText:'AS NOTED', proj:'Riverside Plant (example)', pdf:true,  kind:'pid',   pw:36, ph:24 },
  { num:'A-301', title:'Control room arrangement', rev:'0', scale:24, scaleText:'1/2" = 1\'-0"', proj:'Riverside Plant (example)', pdf:true, kind:'panel', pw:36, ph:24 },
  { num:'E-201', title:'MCC-4 one-line', rev:'1', scale:0, scaleText:'NTS', proj:'Riverside Plant (example)', pdf:false, kind:'loop', pw:17, ph:11 },
  { num:'L-1042', title:'FT-1042 loop drawing', rev:'1', scale:0, scaleText:'NTS', proj:'Riverside Plant (example)', pdf:true,  kind:'loop',  pw:17, ph:11 },
  { num:'P-210', title:'Chemical feed P&ID', rev:'4', scale:64, scaleText:'3/16" = 1\'-0"', proj:'Hilltop Mill (example)', pdf:false, kind:'pid', pw:36, ph:24 },
];
const PROJECT_FOLDER = p => `Dropbox / Projects / ${p} / Drawings`;

// ---------- state ----------
const params = new URLSearchParams(location.search);
const S = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  tool:'pen', color:'red', units:'ftin', ribbonTab:'Draw', paletteMore:false,
  view:{ cx:0, cy:0, z:1 },
  sheets:[], strokes:[], texts:[], dims:[], frames:[],
  measure:null, pending:null, win:null, winPop:null, sel:null, lasso:null,
  framePreset:{ paper:'24×36', scale:48 },
  recording:null, job:null, modal:null, cursor:null, saved:'Saved · synced to Dropbox',
};
const undo = [];
const snap = () => { undo.push(JSON.stringify({ s:S.strokes, t:S.texts, d:S.dims, f:S.frames, sh:S.sheets })); if (undo.length > 60) undo.shift(); dirty(); };
function doUndo() { const u = undo.pop(); if (!u) return; const o = JSON.parse(u); S.strokes=o.s; S.texts=o.t; S.dims=o.d; S.frames=o.f; S.sheets=o.sh; S.sel=null; draw(); chrome(); }
function dirty() { S.saved = 'Saving on the Duo…'; clearTimeout(dirty.t); dirty.t = setTimeout(() => { S.saved = 'Saved · synced to Dropbox'; live(); }, 700); }

function addSheet(e, x, y, scale) {
  const nts = scale === 0;
  const k = nts ? 1 : scale;
  const s = { id: Math.random().toString(36).slice(2,7), num:e.num, title:e.title, rev:e.rev, proj:e.proj, kind:e.kind, pw:e.pw, ph:e.ph, scale:k, nts, x, y, result:e.result||false };
  S.sheets.push(s); return s;
}
const sheetW = s => s.pw * s.scale, sheetH = s => s.ph * s.scale;

// seed canvas: two scaled sheets and one NTS sheet, plus a little markup
addSheet(INDEX[0], 0, 0, 48);
addSheet(INDEX[2], 1900, 0, 24);
addSheet(INDEX[4], 1900, 700, 0);
S.strokes.push({ c:'red', w:3, hl:false, pts: cloud(860, 380, 210, 120) });
S.strokes.push({ c:'red', w:3, hl:false, pts: [[760,460],[980,460]] });
S.strokes.push({ c:'red', w:3, hl:false, pts: bowtie(870, 460, 22) });
S.strokes.push({ c:'green', w:3, hl:false, pts: [[1180,300],[1260,380]] });
S.strokes.push({ c:'green', w:3, hl:false, pts: [[1260,300],[1180,380]] });
S.texts.push({ x:760, y:330, size:26, c:'blue', text:'Add bypass around FCV-101 w/ 2" gate valves' });
S.frames.push({ x:2330, y:40, w:36*12, h:24*12, paper:'24×36', scale:12 });
function cloud(cx, cy, w, h) { const p=[]; const n=26; for (let i=0;i<=n;i++){ const a=i/n*Math.PI*2; const r=1+0.06*Math.sin(i*Math.PI); p.push([cx+Math.cos(a)*w/2*r, cy+Math.sin(a)*h/2*r]); } return p; }
function bowtie(cx, cy, s) { return [[cx-s,cy-s*.6],[cx+s,cy+s*.6],[cx+s,cy-s*.6],[cx-s,cy+s*.6],[cx-s,cy-s*.6]]; }

// ---------- units ----------
function fmt(inches, nts) {
  if (nts) return (Math.round(inches * 16) / 16).toFixed(2) + '" NTS';
  if (S.units === 'mm') { const mm = inches * 25.4; return mm >= 10000 ? (mm/1000).toFixed(2) + ' m' : Math.round(mm) + ' mm'; }
  if (S.units === 'ft') return (inches / 12).toFixed(2) + "'";
  const neg = inches < 0; inches = Math.abs(inches);
  let ft = Math.floor(inches / 12); let rem = Math.round((inches - ft * 12) * 2) / 2;
  if (rem >= 12) { ft++; rem = 0; }
  const whole = Math.floor(rem), half = rem - whole ? ' 1/2' : '';
  return (neg?'-':'') + `${ft}'-${whole}${half}"`;
}
const UNIT_LABEL = { ftin:'Feet and inches', ft:'Decimal feet', mm:'Metric' };
function niceLen(px) { // world inches whose screen length is about px
  const target = px / S.view.z;
  const c = S.units === 'mm' ? [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].map(m => m/25.4)
                             : [1,2,6,12,24,60,120,240,600,1200,2400,6000,12000,24000,60000,120000];
  for (const v of c) if (v >= target) return v; return c[c.length-1];
}

const LAYOUT = { A:{ toastTop:58, jobAt:{ right:96, bottom:50 }, optsTop:58, inset:{ l:70, r:92, t:56, b:50 } },
                 B:{ toastTop:60, jobAt:{ right:14, bottom:96 }, optsTop:60, inset:{ l:10, r:10, t:70, b:84 } },
                 C:{ toastTop:98, jobAt:{ right:12, bottom:42 }, optsTop:98, inset:{ l:212, r:8, t:96, b:38 } } };
// ---------- view ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let R = 1;
function fit() {
  const sw = innerWidth, sh = innerHeight - 40;
  const k = Math.min(sw / W, sh / H);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${k})`; st.style.left = (sw - W*k)/2 + 'px'; st.style.top = (sh - H*k)/2 + 'px';
  R = (devicePixelRatio || 1) * k;
  cv.width = Math.round(W * R); cv.height = Math.round(H * R);
  draw();
}
const toWorld = (sx, sy) => [ (sx - W/2) / S.view.z + S.view.cx, (sy - H/2) / S.view.z + S.view.cy ];
const toScreen = (wx, wy) => [ (wx - S.view.cx) * S.view.z + W/2, (wy - S.view.cy) * S.view.z + H/2 ];
function zoomTo(x0, y0, x1, y1, pad = 0.9) { // fits the region into the part of the screen the variant's chrome leaves free
  const i = LAYOUT[S.variant].inset, aw = W - i.l - i.r, ah = H - i.t - i.b;
  S.view.z = Math.min(aw / Math.max(1, x1 - x0), ah / Math.max(1, y1 - y0)) * pad;
  S.view.cx = (x0 + x1) / 2 - ((i.l - i.r) / 2) / S.view.z; S.view.cy = (y0 + y1) / 2 - ((i.t - i.b) / 2) / S.view.z; draw(); live();
}
function extents() {
  let a=[Infinity,Infinity,-Infinity,-Infinity];
  for (const s of S.sheets) { a[0]=Math.min(a[0],s.x); a[1]=Math.min(a[1],s.y); a[2]=Math.max(a[2],s.x+sheetW(s)); a[3]=Math.max(a[3],s.y+sheetH(s)); }
  for (const f of S.frames) { a[0]=Math.min(a[0],f.x); a[1]=Math.min(a[1],f.y); a[2]=Math.max(a[2],f.x+f.w); a[3]=Math.max(a[3],f.y+f.h); }
  for (const st of S.strokes) for (const p of st.pts) { a[0]=Math.min(a[0],p[0]); a[1]=Math.min(a[1],p[1]); a[2]=Math.max(a[2],p[0]); a[3]=Math.max(a[3],p[1]); }
  if (!isFinite(a[0])) a = [-500,-500,500,500];
  zoomTo(a[0], a[1], a[2], a[3]);
}
function zoomAt(sx, sy, f) {
  const [wx, wy] = toWorld(sx, sy);
  S.view.z = Math.min(400, Math.max(0.004, S.view.z * f));
  S.view.cx = wx - (sx - W/2) / S.view.z; S.view.cy = wy - (sy - H/2) / S.view.z; draw(); live();
}

// ---------- drawing ----------
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(render); }
function render() {
  raf = 0; const z = S.view.z;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#f3efe6'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(R*z, 0, 0, R*z, R*(W/2 - S.view.cx*z), R*(H/2 - S.view.cy*z));
  grid();
  for (const s of S.sheets) drawSheet(s);
  for (const f of S.frames) drawFrame(f);
  for (const st of S.strokes) drawStroke(st, S.sel && S.sel.strokes.includes(st));
  for (const t of S.texts) drawText(t, S.sel && S.sel.texts.includes(t));
  for (const d of S.dims) drawDim(d, true);
  if (S.measure) drawDim(S.measure, false);
  if (S.pending && S.pending.b) drawDim(S.pending, S.pending.kind === 'dim');
  if (S.win) { ctx.save(); ctx.setLineDash([6/z,4/z]); ctx.strokeStyle = '#2f5d8a'; ctx.lineWidth = 1.2/z; ctx.fillStyle='rgba(47,93,138,.07)';
    const [x0,y0,x1,y1] = rectOf(S.win); ctx.fillRect(x0,y0,x1-x0,y1-y0); ctx.strokeRect(x0,y0,x1-x0,y1-y0); ctx.restore(); }
  if (S.lasso) { ctx.save(); ctx.setLineDash([5/z,4/z]); ctx.strokeStyle='#2f5d8a'; ctx.lineWidth=1.2/z; ctx.beginPath(); S.lasso.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.restore(); }
  if (S.sel) { const b = selBox(); if (b) { ctx.save(); ctx.setLineDash([5/z,4/z]); ctx.strokeStyle='#2f5d8a'; ctx.lineWidth=1.2/z; ctx.strokeRect(b[0]-6/z,b[1]-6/z,b[2]-b[0]+12/z,b[3]-b[1]+12/z); ctx.restore(); } }
}
function grid() {
  const z = S.view.z, step = niceLen(28), major = step * (S.units === 'mm' ? 10 : (step < 12 ? 12/step : 10));
  const [x0,y0] = toWorld(0,0), [x1,y1] = toWorld(W,H);
  ctx.lineWidth = 1/z;
  for (const [sp, col] of [[step,'rgba(120,110,90,.10)'],[major,'rgba(120,110,90,.20)']]) {
    if (sp * z < 6) continue; ctx.strokeStyle = col; ctx.beginPath();
    for (let x = Math.floor(x0/sp)*sp; x < x1; x += sp) { ctx.moveTo(x,y0); ctx.lineTo(x,y1); }
    for (let y = Math.floor(y0/sp)*sp; y < y1; y += sp) { ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
    ctx.stroke();
  }
}
function drawSheet(s) {
  const z = S.view.z, k = s.scale;
  ctx.save(); ctx.translate(s.x, s.y); ctx.scale(k, k);
  const pz = z * k; // screen px per paper inch
  ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 8; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,s.pw,s.ph); ctx.shadowBlur = 0;
  const lw = Math.max(0.014, 0.6 / pz); ctx.lineWidth = lw; ctx.strokeStyle = '#222';
  ctx.strokeRect(0.5,0.5,s.pw-1,s.ph-1);
  const tbw = Math.min(7, s.pw*0.42), tbh = Math.min(2, s.ph*0.18), tx = s.pw-0.5-tbw, ty = s.ph-0.5-tbh;
  ctx.strokeRect(tx,ty,tbw,tbh); ctx.beginPath(); ctx.moveTo(tx,ty+tbh*.45); ctx.lineTo(tx+tbw,ty+tbh*.45); ctx.moveTo(tx+tbw*.62,ty+tbh*.45); ctx.lineTo(tx+tbw*.62,ty+tbh); ctx.stroke();
  if (pz * 0.3 > 3) {
    ctx.fillStyle = '#222'; ctx.font = `600 ${tbh*0.2}px system-ui`; ctx.fillText(`${s.title}`, tx+0.15, ty+tbh*0.3);
    ctx.font = `${tbh*0.13}px system-ui`; ctx.fillText(`${s.proj}`, tx+0.15, ty+tbh*0.65);
    ctx.fillText(`SCALE: ${s.nts ? 'NTS' : scaleLabel(s.scale)}`, tx+0.15, ty+tbh*0.88);
    ctx.font = `700 ${tbh*0.24}px system-ui`; ctx.fillText(`${s.num}`, tx+tbw*.66, ty+tbh*0.75);
    ctx.font = `${tbh*0.12}px system-ui`; ctx.fillText(`REV ${s.rev}`, tx+tbw*.66, ty+tbh*0.92);
  }
  ctx.lineWidth = lw * 1.1;
  if (s.kind === 'pid') pid(s, pz); else if (s.kind === 'panel') panel(s, pz); else loop(s, pz);
  if (s.result) { // the redlined revision: the bypass drawn properly with a valve block, inside a revision cloud
    ctx.strokeStyle = '#222'; line(15.8, 7.5, 15.8, 9.6); line(15.8, 9.6, 20.4, 9.6); line(20.4, 9.6, 20.4, 7.5); valve(17, 9.6, 0.35); valve(19.2, 9.6, 0.35);
    ctx.strokeStyle = '#d6342c'; ctx.lineWidth = Math.max(0.03, 1.2/pz); ctx.beginPath(); cloud(18.1, 8.7, 6.4, 3.4).forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    label('REV 3 · BYPASS ADDED (VELLUM)', 15.4, 11, 0.28, pz); }
  ctx.restore();
  // label above the sheet, constant screen size
  const [sx, sy] = toScreen(s.x, s.y);
  ctx.save(); ctx.setTransform(R,0,0,R,0,0); ctx.font = '600 11px system-ui'; ctx.fillStyle = s.nts ? '#8a5a00' : '#2f5d8a';
  ctx.fillText(`${s.num}  ·  ${s.nts ? 'NTS · printed size' : scaleLabel(s.scale)}${s.result ? '  ·  REV 3 · RESULT OF REDLINE' : ''}`, sx, sy - 6); ctx.restore();
}
function line(a,b,c,d){ ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); }
function valve(x,y,s){ ctx.beginPath(); ctx.moveTo(x-s,y-s*.6); ctx.lineTo(x+s,y+s*.6); ctx.lineTo(x+s,y-s*.6); ctx.lineTo(x-s,y+s*.6); ctx.closePath(); ctx.stroke(); }
function label(t,x,y,size,pz){ if (pz*size < 3) return; ctx.fillStyle='#222'; ctx.font = `${size}px system-ui`; ctx.fillText(t,x,y); }
function pid(s,pz) {
  ctx.strokeRect(2,3,4,9); label('DA-1 DEAERATOR',2,2.6,0.3,pz);
  line(6,7.5,31,7.5); line(12,7.5,12,14); line(12,14,26,14); line(26,14,26,7.5); line(20,7.5,20,3.5); line(20,3.5,31,3.5);
  for (const x of [9,15.5,22.5,28]) valve(x,7.5,0.35);

          <b style="margin:0 12px 0 4px">Boiler 4 walkdown</b>
          ${Object.keys(rib).map(t => `<button data-act="rtab" data-t="${t}" style="padding:5px 12px;border-radius:8px;font-weight:${S.ribbonTab===t?700:500};${S.ribbonTab===t?'background:#e6edf5;color:var(--accent)':''}">${t}</button>`).join('')}
          <div style="flex:1"></div><button class="ic" data-act="undo" aria-label="Undo" title="Undo" style="width:34px;height:28px">${svg('undo',18)}</button>
          <button class="primary" data-act="send" style="padding:4px 12px">Send…</button></div>
        <div style="display:flex;align-items:center;gap:2px;height:57px;padding:0 8px">${rib[S.ribbonTab]}</div></div>
      <div class="panel" style="position:absolute;left:0;top:90px;bottom:0;width:206px;border-width:0 1px 0 0;border-radius:0;display:flex;flex-direction:column">
        <div style="padding:10px 12px 4px;font-weight:700">Sheet set</div>
        <div style="flex:1;overflow:auto">${S.sheets.map(s => `<button data-act="zoomsheet" data-id="${s.id}" style="display:block;width:100%;text-align:left;padding:7px 12px;border-bottom:1px solid #eee5d6"><b>${s.num}</b> ${s.title}<br><span style="font-size:11px;color:${s.nts?'#8a5a00':'#2f5d8a'}">${s.nts?'NTS · printed size':scaleLabel(s.scale)}${s.result?' · result':''}</span></button>`).join('')}
          ${S.frames.map((f,i) => `<button data-act="zoomframe" data-i="${i}" style="display:block;width:100%;text-align:left;padding:7px 12px;border-bottom:1px solid #eee5d6;color:#7a4fb3"><b>Frame ${i+1}</b> ${f.paper}<br><span style="font-size:11px">${scaleLabel(f.scale)}</span></button>`).join('')}</div>
        <div style="padding:8px 10px;border-top:1px solid var(--line)"><button class="ghost" data-act="add" style="width:100%">${svg('search',14)} Search drawings…</button></div></div>
      <div class="panel" style="position:absolute;left:206px;right:0;bottom:0;height:32px;border-width:1px 0 0 0;border-radius:0;display:flex;align-items:center;gap:14px;padding:0 10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#333">
        <span style="color:#2f5d8a;font-weight:700">${S.tool.toUpperCase()}</span><span data-live="prompt" style="flex:1"></span><span data-live="bar" style="font-family:system-ui"></span><span data-live="coords" style="min-width:150px"></span><span data-live="saved" style="font-family:system-ui;color:#2f7a4f"></span></div>`;
  }
  document.getElementById('chrome').innerHTML = h;
  shared(); live();
  document.getElementById('vlabel').textContent = `${S.variant} — ${VARIANTS[S.variant]}`;
}
function live() {
  const bar = niceLen(90); const px = Math.round(bar * S.view.z);
  const c = S.cursor ? `X ${fmt(S.cursor[0])}  Y ${fmt(-S.cursor[1])}` : '';
  for (const el of document.querySelectorAll('[data-live]')) {
    const k = el.dataset.live;
    if (k === 'coords') el.textContent = c;
    if (k === 'prompt') el.textContent = prompt();
    if (k === 'saved') el.textContent = S.saved;
    if (k === 'bar') el.innerHTML = `<span style="display:inline-block;vertical-align:middle;width:${px}px;height:6px;border:1.5px solid #333;border-top:0;margin-right:6px"></span>${fmt(bar)}`;
  }
  document.getElementById('vstate').textContent = `tool ${S.tool} · ink ${COLOR_MEANING[S.color]} · ${UNIT_LABEL[S.units]} · ${S.strokes.length} strokes, ${S.texts.length} text, ${S.dims.length} dims, ${S.frames.length} frames${S.recording?' · recording':''}${S.job?' · job: '+S.job.status:''}`;
}

// ---------- switcher ----------
function setVariant(v) { S.variant = v; const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); chrome(); extents(); }
const keys = Object.keys(VARIANTS);
document.getElementById('prev').onclick = () => setVariant(keys[(keys.indexOf(S.variant) + keys.length - 1) % keys.length]);
document.getElementById('next').onclick = () => setVariant(keys[(keys.indexOf(S.variant) + 1) % keys.length]);
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click(); if (e.key === 'ArrowRight') document.getElementById('next').click();
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); doUndo(); } });
addEventListener('resize', fit);
fit(); chrome(); extents();
</script>
</body>
</html>
