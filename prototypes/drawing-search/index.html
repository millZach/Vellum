<!doctype html>
<!--
  PROTOTYPE — throwaway. Never merge to main; kept as the tag prototype/drawing-search.
  For Vellum #13, milestone 2: what searching the drawing index and opening a drawing looks like on the Duo.

  Three structurally different variants, switched with ?v=A|B|C and the black bar at the bottom (or the arrow keys):
    A  Search on the Drawings tab. Opening a drawing makes a new canvas named after it, the PDF placed at its scale.
    B  Search on the Drawings tab. Opening shows a viewer (pages, zoom) with "Place on a canvas" and "Open in a new canvas".
    C  Search inside a canvas: Add sheet gains a search over the index at its top. The Drawings tab keeps browsing folders.
  Every variant also shows opening a DWG with no PDF yet: plotting on the laptop, queued while offline, waiting for the
  laptop while it is off, and how it resolves when the PDF arrives. Flip Duo online/offline and Laptop on/off in the
  State panel.

  Other switches: ?theme=dark, ?fold=1 (the folded cover screen, 382 x 644 pt; unfolded is 951 x 669 pt), ?state=0 hides
  the State panel. Chrome follows the picked canvas screen (prototype/canvas-screen A, ADR-0011), the Canvases list as
  built, the Drawings tab as built, and the Add sheet steps from prototype/place-sheets.

  Every drawing, project, canvas and file name here is made up. Thumbnails are simple SVG sketches.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vellum: search and open drawings (prototype)</title>

<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:#1b1b1d; overflow:hidden; font:13px/1.35 -apple-system,system-ui,"SF Pro Text","Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  button[disabled] { cursor:default; }

  /* ---------- themes (the app's Chrome colours, the iOS grouped list of the Drawings tab) ---------- */
  .th-light { --ink:#1d1d1f; --mute:#6b6b70; --line:#d9d4c9; --paper:#f3efe6; --panel:rgba(252,250,246,.94); --accent:#2f5d8a; --accent-soft:#e6edf5;
    --btn:#2f5d8a; --ghostbg:#fff; --modal:#fffdf9; --row:#eee5d6; --rowhover:rgba(0,0,0,.035); --tag:#eee8dc; --tagt:#555;
    --ok:#2f7a4f; --okbg:#e3f1e8; --plot:#9a5b00; --plotbg:#f7ebd7; --only:#6b3fa8; --onlybg:#efe7f8; --hl:#fde68a;
    --gbg:#f2f2f7; --gcard:#fff; --sep:#e5e5ea; --sfbg:rgba(118,118,128,.12); --sp:#fff; --sl:#2b2b2e; --grid:rgba(0,0,0,.05); --sketch:#3a3a3a;
    --railbg:rgba(255,255,255,.88); --railb:#e2e2e6; --railsel:rgba(120,120,128,.14); --shadow:0 2px 10px rgba(0,0,0,.08); color-scheme:light; }
  .th-dark { --ink:#e8e6e1; --mute:#a9a9ae; --line:#3a3b40; --paper:#1c1d20; --panel:rgba(36,37,41,.94); --accent:#9cc4ec; --accent-soft:#2c3a4a;
    --btn:#3f74a8; --ghostbg:#2a2b2f; --modal:#26272b; --row:#3a3b40; --rowhover:rgba(255,255,255,.05); --tag:#3a3b40; --tagt:#cfcfd3;
    --ok:#6fcf97; --okbg:rgba(111,207,151,.14); --plot:#e0a458; --plotbg:rgba(224,164,88,.15); --only:#c4a2f0; --onlybg:rgba(196,162,240,.15); --hl:rgba(253,230,138,.32);
    --gbg:#000; --gcard:#1c1c1e; --sep:#38383a; --sfbg:rgba(118,118,128,.24); --sp:#26272b; --sl:#d6d6da; --grid:rgba(255,255,255,.045); --sketch:#e6e6e6;
    --railbg:rgba(44,44,46,.92); --railb:#3a3a3c; --railsel:rgba(255,255,255,.12); --shadow:0 2px 12px rgba(0,0,0,.45); color-scheme:dark; }

  /* ---------- the Duo ---------- */
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; border-radius:18px; color:var(--ink); background:var(--paper);
           box-shadow:0 0 0 7px #050506, 0 14px 50px rgba(0,0,0,.6); user-select:none; -webkit-user-select:none; }
  #stage.folded { border-radius:38px; }
  .content { position:absolute; overflow:hidden; }
  .bgfill { position:absolute; inset:0; }
  #stage *, #stage { scrollbar-width:none; } #stage ::-webkit-scrollbar { display:none; }
  .sys { position:absolute; display:flex; align-items:center; font-weight:600; color:var(--ink); pointer-events:none; }
  .unfolded .sys { right:0; top:24px; width:84px; flex-direction:column; gap:6px; font-size:15px; }
  .unfolded .sys .wf { width:40px; height:40px; border-radius:20px; border:3px solid #34c759; display:flex; align-items:center; justify-content:center; }
  .unfolded .sys .wf.off { border-color:var(--mute); color:var(--mute); }
  .folded .sys { left:0; right:0; top:0; height:44px; padding:0 30px 0 34px; justify-content:space-between; font-size:15px; }
  .folded .sys .wf { display:flex; gap:6px; align-items:center; }
  .folded .sys .wf.off { color:var(--mute); }
  .gear { position:absolute; right:19px; top:123px; width:46px; height:46px; border-radius:23px; background:var(--railbg); border:1px solid var(--railb); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .tabrail { position:absolute; right:24px; top:433px; width:48px; border-radius:24px; padding:5px 3px; background:var(--railbg); border:1px solid var(--railb); box-shadow:var(--shadow);
             display:flex; flex-direction:column; gap:4px; backdrop-filter:blur(10px); }
  .tabrail button { height:48px; border-radius:21px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .tabrail button.on { background:var(--railsel); color:#2f7fe0; }
  .th-dark .tabrail button.on { color:#5aa9ff; }
  .tabbar { position:absolute; left:0; right:0; bottom:0; height:83px; padding:6px 10px 0; display:flex; justify-content:space-around; align-items:flex-start;
            background:var(--railbg); border-top:1px solid var(--railb); backdrop-filter:blur(10px); }
  .tabbar button { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:500; color:var(--mute); width:76px; }
  .tabbar button.on { color:#2f7fe0; } .th-dark .tabbar button.on { color:#5aa9ff; }

  /* ---------- shared controls ---------- */
  .primary { background:var(--btn); color:#fff; border-radius:9px; padding:8px 13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .primary[disabled] { opacity:.45; }
  .ghost { border:1px solid var(--line); border-radius:9px; padding:7px 11px; background:var(--ghostbg); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .ghost[disabled] { opacity:.45; }
  .ghost.sel { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .panel { background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); backdrop-filter:blur(8px); }
  .sf { display:flex; align-items:center; gap:7px; background:var(--sfbg); border-radius:10px; height:38px; padding:0 8px 0 10px; color:var(--mute); flex:none; }
  .sf input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:15px; color:var(--ink); padding:0; }
  .sf input::placeholder { color:var(--mute); }
  .sf button { color:var(--mute); width:22px; height:22px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .iline { font-size:12px; color:var(--mute); margin:6px 2px 10px; display:flex; align-items:center; gap:5px; flex:none; flex-wrap:wrap; }
  .iline .offl { color:var(--plot); font-weight:600; display:inline-flex; align-items:center; gap:4px; }
  .thumb { flex:none; border-radius:5px; border:1px solid var(--line); overflow:hidden; background:var(--sp); display:flex; color:var(--sl); }
  .thumb svg { width:100%; height:100%; display:block; }
  .mk { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 7px; border-radius:7px; white-space:nowrap; font-weight:600; line-height:1.35; }
  .mk.plot { background:var(--plotbg); color:var(--plot); } .mk.only { background:var(--onlybg); color:var(--only); }
  .mk.ok { background:var(--okbg); color:var(--ok); } .mk.off { background:var(--tag); color:var(--mute); } .mk.cv { background:var(--accent-soft); color:var(--accent); }
  .tag { font-size:11px; padding:2px 6px; border-radius:6px; background:var(--tag); color:var(--tagt); white-space:nowrap; }
  mark { background:var(--hl); color:inherit; border-radius:3px; padding:0 1px; }
  .dl { height:4px; border-radius:2px; background:var(--row); overflow:hidden; margin-top:5px; width:160px; max-width:100%; }
  .dl i { display:block; height:100%; width:0; background:var(--accent); animation:fill .9s linear forwards; }
  @keyframes fill { to { width:100%; } }
  .spin { animation:spin 1.1s linear infinite; transform-origin:50% 50%; } @keyframes spin { to { transform:rotate(360deg); } }
  .note { color:var(--mute); font-size:12px; }
  .legend { color:var(--mute); font-size:12px; margin:12px 4px 0; line-height:1.7; }
  .backbtn { display:inline-flex; align-items:center; color:var(--accent); font-weight:600; font-size:14px; margin:0 0 6px -4px; padding:2px 4px; }

  /* ---------- Drawings tab (grouped list, as built) ---------- */
  .grouped { position:absolute; inset:0; background:var(--gbg); }
  .dscreen { position:absolute; inset:0; display:flex; flex-direction:column; padding:14px 20px 0; }
  .folded .dscreen { padding:6px 14px 0; }
  .dscreen h1, .bleft h1 { font-size:26px; margin:4px 0 10px; font-weight:700; }
  .dlist { flex:1; overflow:auto; padding-bottom:16px; }
  .gcard { background:var(--gcard); border-radius:12px; overflow:hidden; }
  .ghead { font-size:13px; color:var(--mute); margin:4px 20px 6px; }
  .res { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:8px 14px 8px 12px; position:relative; }
  .res + .res::before { content:""; position:absolute; left:var(--sepx,108px); right:0; top:0; border-top:1px solid var(--sep); }
  .res:hover { background:var(--rowhover); }
  .res.sel { background:var(--accent-soft); }
  .rmain { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .rt { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rm { font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rtags { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none; }
  .rchev { flex:none; color:var(--mute); display:flex; }
  .browse { display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; background:var(--gcard); border-radius:12px; margin-top:12px; font-size:15px; text-align:left; }
  .browse .fi { color:#2f7fe0; display:flex; } .browse .grow { flex:1; }
  .frow { display:flex; align-items:center; gap:14px; width:100%; padding:12px 16px; text-align:left; font-size:16px; position:relative; }
  .frow + .frow::before { content:""; position:absolute; left:58px; right:0; top:0; border-top:1px solid var(--sep); }
  .frow .fi { color:#2f7fe0; display:flex; } .frow .grow { flex:1; min-width:0; } .frow .rm { font-size:12px; }
  .crumbs { font-size:13px; color:var(--mute); margin:0 4px 8px; }
  .crumbs button { color:var(--accent); font-weight:600; }
  .empty { padding:28px 20px; text-align:center; color:var(--mute); }

  /* B: list and viewer side by side */
  .bsplit { position:absolute; inset:0; display:flex; }
  .bleft { width:372px; flex:none; display:flex; flex-direction:column; padding:14px 0 0 16px; }
  .bleft .sf, .bleft .iline { margin-right:4px; }
  .bleft .dlist { padding-right:4px; }
  .bright { flex:1; min-width:0; padding:14px 8px 14px 12px; display:flex; }
  .viewer { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--gcard); border-radius:14px; border:1px solid var(--sep); overflow:hidden; }
  .viewer.full { position:absolute; inset:8px 8px 8px 8px; }
  .folded .viewer.full { inset:0; border-radius:0; border:0; }
  .vhead { padding:12px 14px 8px; }
  .vtitle { font-size:17px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
  .vtitle span { font-weight:600; }
  .vmeta { color:var(--mute); font-size:12.5px; margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 10px; }
  .vmeta b { color:var(--ink); font-weight:600; }
  .vtools { display:flex; align-items:center; gap:6px; padding:6px 10px; border-top:1px solid var(--sep); border-bottom:1px solid var(--sep); font-size:12.5px; }
  .vtools .grow { flex:1; }
  .vtools .ib { width:30px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--ghostbg); }
  .vtools .ib[disabled] { opacity:.4; }
  .vtools .zl { min-width:42px; text-align:center; font-variant-numeric:tabular-nums; }
  .vstrip { display:flex; gap:8px; padding:8px 10px 0; }
  .vstrip button { width:92px; border:1px solid var(--line); border-radius:8px; padding:4px; display:flex; flex-direction:column; gap:3px; font-size:11px; text-align:left; background:var(--ghostbg); }
  .vstrip button.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .vstrip .thumb { width:100%; aspect-ratio:3/2; }
  .vpage { flex:1; min-height:0; overflow:auto; background:var(--paper); position:relative; cursor:grab; }
  .vpage.z1 { cursor:default; }
  .vzoom { margin:14px auto; color:var(--sl); box-shadow:0 1px 6px rgba(0,0,0,.18); background:var(--sp); }
  .vzoom svg { display:block; width:100%; height:auto; }
  .vwait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
  .vwait .ghostart { position:absolute; inset:18px; opacity:.22; color:var(--sl); display:flex; align-items:center; justify-content:center; }
  .vwait .ghostart svg { max-width:100%; max-height:100%; }
  .vacts { display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--sep); }
  .vacts .note { flex:1; min-width:0; }
  .folded .vacts { flex-wrap:wrap; } .folded .vacts .note { flex-basis:100%; }
  .vempty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--mute); gap:8px; padding:30px; text-align:center; }

  /* the plot card (no PDF yet) */
  .plotcard { position:relative; width:min(380px,100%); background:var(--modal); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .plotcard h3 { margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .plotcard p { margin:4px 0; font-size:12.5px; color:var(--mute); }
  .steps { margin:8px 0 2px; padding:0; list-style:none; font-size:12.5px; }
  .steps li { display:flex; align-items:center; gap:7px; margin:3px 0; color:var(--mute); }
  .steps li.done { color:var(--ok); } .steps li.now { color:var(--ink); font-weight:600; }
  .steps .dot { width:14px; height:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .pbar { height:4px; border-radius:2px; background:var(--row); overflow:hidden; margin-top:8px; }
  .pbar i { display:block; height:100%; background:var(--plot); transition:width .25s linear; }

  /* ---------- Canvases list (as built) ---------- */
  .clist { position:absolute; inset:0; background:var(--paper); }
  .clcol { position:absolute; left:24px; top:14px; width:328px; bottom:14px; display:flex; flex-direction:column; }
  .clhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .clhead h1 { font-size:26px; margin:0; font-weight:700; }
  .crow { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:10px; }
  .crow b { font-size:15px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crow span { color:var(--mute); font-size:12.5px; }
  .crow.sel { background:var(--accent-soft); }
  .cprev { position:absolute; left:370px; right:9px; top:14px; bottom:59px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper); }
  .cfoot { position:absolute; left:370px; right:9px; bottom:12px; height:36px; display:flex; align-items:center; gap:8px; }
  .cfoot b { flex:1; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folded .clcol { left:14px; right:14px; width:auto; top:6px; bottom:0; }
  .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:var(--gbg); color:var(--mute); }
  .placeholder h1 { color:var(--ink); margin:0; font-size:26px; }

  /* ---------- canvas screen (drafting rail, ADR-0011) ---------- */
  .cscreen { position:absolute; inset:0; background:var(--paper); }
  svg.cv { position:absolute; inset:0; display:block; }
  .lrail { position:absolute; left:8px; top:8px; bottom:8px; width:54px; border-radius:14px; display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; }
  .lrail .tb { width:42px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .lrail .tb.on { background:var(--accent-soft); color:var(--accent); }
  .lrail hr { width:32px; border:0; border-top:1px solid var(--line); margin:4px 0; }
  .chip { width:22px; height:22px; border-radius:11px; border:2px solid var(--ghostbg); box-shadow:0 0 0 1px var(--line); }
  .chip.sel { box-shadow:0 0 0 2px var(--ink); }
  .tbar { position:absolute; left:70px; top:8px; height:40px; border-radius:12px; display:flex; align-items:center; gap:12px; padding:0 12px; white-space:nowrap; }
  .tbar b { font-size:14.5px; max-width:300px; overflow:hidden; text-overflow:ellipsis; }
  .tbar .units { display:inline-flex; align-items:center; gap:2px; }
  .tbar button { display:flex; align-items:center; }
  .tact { position:absolute; right:8px; top:8px; display:flex; gap:8px; }
  .tact .ghost, .tact .primary { height:40px; padding:0 13px; border-radius:11px; }
  .chipcol { position:absolute; right:8px; top:56px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .pchip { box-shadow:var(--shadow); height:36px; padding:0 12px; border-radius:11px; display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12.5px; background:var(--plotbg); color:var(--plot); border:1px solid transparent; }
  .pchip.ready { background:var(--btn); color:#fff; }
  .sbar { position:absolute; left:70px; right:8px; bottom:8px; height:34px; border-radius:11px; display:flex; align-items:center; gap:14px; padding:0 12px; font-size:12px; color:var(--mute); white-space:nowrap; }
  .sbar .pr { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .sbar .sv { color:var(--ok); } .sbar .sv.off { color:var(--plot); }
  .sbar .sb { display:inline-flex; align-items:center; gap:6px; }
  .sbar .sb i { display:inline-block; height:6px; border:1.5px solid currentColor; border-top:0; }
  .pill { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:6px 6px 6px 12px; border-radius:12px; font-size:13px; white-space:nowrap; max-width:calc(100% - 140px); }
  .pill > span { overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:7px; }
  .pill.plot { border-color:var(--plot); }
  .pill .ghost, .pill .primary { padding:5px 11px; }
  .folded .tbar { left:8px; right:8px; gap:8px; padding:0 6px 0 4px; }
  .folded .tbar b { flex:1; max-width:none; }
  .folded .sbar { left:8px; }
  .folded .pill { left:8px; right:8px; transform:none; max-width:none; white-space:normal; }
  .folded .pill > span { display:block; }

  /* ---------- modals, toasts ---------- */
  .scrim { position:absolute; inset:0; background:rgba(20,20,20,.32); display:flex; align-items:center; justify-content:center; padding:12px; z-index:5; }
  .modal { width:600px; max-width:100%; max-height:100%; overflow:auto; background:var(--modal); border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.3); padding:14px 16px; display:flex; flex-direction:column; }
  .modal.tall { height:620px; }
  .modal h2 { font-size:17px; margin:0 0 8px; }
  .modal p { margin:8px 0; }
  .modal .row { display:flex; gap:8px; align-items:center; margin:10px 0 0; flex-wrap:wrap; }
  .modal .row.end { justify-content:flex-end; }
  .modal .row .note { flex:1; min-width:150px; }
  .folded .scrim { align-items:flex-end; padding:0; }
  .folded .modal { width:100%; border-radius:16px 16px 0 0; max-height:94%; }
  .folded .modal.tall { height:94%; }
  .crumb { color:var(--mute); font-size:12px; margin:0 0 6px; }
  .mlist { flex:1; min-height:0; overflow:auto; margin:4px -6px 0; }
  .mlist .sec { font-size:11.5px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.03em; padding:10px 6px 4px; }
  .mrow { display:flex; width:100%; text-align:left; padding:7px 6px; border-bottom:1px solid var(--row); gap:10px; align-items:center; }
  .mrow:hover { background:var(--rowhover); }
  .mrow .nm { flex:1; min-width:0; } .mrow .nm .rm { font-size:11.5px; }
  .mrow .fi { flex:none; color:var(--accent); display:flex; }

// ---------- the canvas ----------
function sheetBox(s) { const d = D(s.num), kk = s.k || 1; return [s.x, s.y, d.pw * kk, d.ph * kk]; }
function extents(c, extra) {
  const bbs = [...c.sheets.map(sheetBox), ...c.ink.map(i => i.bb)]; if (extra) bbs.push(extra);
  if (!bbs.length) return [-480, -320, 960, 640];

  for (const [x, y, w, h] of bbs) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }

function canvasSVG(c, w, h, free, opts = {}) {

  o += `<rect x="${f(vx)}" y="${f(vy)}" width="${f(w / k)}" height="${f(h / k)}" fill="url(#${id})"/>`;
  for (const s of c.sheets) {

  if (S.tab === 'drawings' && S.v === 'C') return 'folders: Dropbox' + S.folder.map(x => ' › ' + x).join('');
  return S.tab + ' tab';
}
function panel() {
  const pnl = document.getElementById('panel'); pnl.style.display = S.panel ? '' : 'none'; if (!S.panel) return;
  const q = S.modal && S.modal.type === 'add' ? S.modal.q : S.q;
  const n = q ? search(q).length : S.drawings.length;
  const sel = S.modal && S.modal.num ? S.modal.num : S.placing ? S.placing.num : S.sel;
  const sd = sel && D(sel);
  const plots = Object.entries(S.plots).map(([num, p]) => p.state === 'done' ? `<span class="okc">${num} plotted</span>` : `<span class="sp">${num} ${p.state}${p.state === 'plotting' ? ' ' + Math.max(0, Math.ceil((PLOT_MS - (Date.now() - p.t0)) / 1000)) + ' s left' : ''}</span>`).join(', ') || 'none';
  const ln = (k, v) => `<div class="ln"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  document.getElementById('pbody').innerHTML =
    ln('variant', `${S.v} · ${esc(VARIANTS[S.v])}`) + ln('screen', `${S.tab} · ${S.fold ? 'folded' : 'unfolded'} · ${S.theme}`) +
    ln('query', q ? `“${esc(q)}” → ${n} of ${S.drawings.length}` : `(empty) → all ${S.drawings.length}`) +
    ln('selected', sd ? `${esc(sd.num)} ${esc(sd.title)} (${sd.files === 'dwg' ? 'DWG, no PDF yet' : sd.files === 'pdf' ? 'PDF only' : 'DWG + PDF'}${S.onDuo.has(sd.num) ? ', on this Duo' : ''})` : 'none') +
    ln('open', esc(openText())) + ln('plots', plots) +
    `<div class="ctl"><span class="k">Duo</span><button data-p="online" class="${S.online ? 'on' : ''}">Online</button><button data-p="offline" class="${S.online ? '' : 'on'}">Offline</button></div>
     <div class="ctl"><span class="k">Laptop</span><button data-p="lon" class="${S.laptop ? 'on' : ''}">On</button><button data-p="loff" class="${S.laptop ? '' : 'on'}">Off</button></div>
     <div class="ctl"><button data-p="arrive">PDF arrives now</button><button data-p="reset">Reset</button></div>
     <div class="try">${esc(TRY[S.v])}</div>`;
}
function barUI() {
  document.getElementById('vlabel').innerHTML = `<b>${S.v}</b> — ${esc(VARIANTS[S.v])}`;
  document.getElementById('themeT').innerHTML = `${svg(S.theme === 'dark' ? 'sun' : 'moon', 15)} ${S.theme === 'dark' ? 'Light' : 'Dark'}`;
  document.getElementById('foldT').textContent = S.fold ? 'Unfold' : 'Fold';
  document.getElementById('stateT').classList.toggle('on', S.panel);
}
function url() {
  const u = new URL(location); u.searchParams.delete('variant'); u.searchParams.set('v', S.v);
  if (S.theme === 'dark') u.searchParams.set('theme', 'dark'); else u.searchParams.delete('theme');
  if (S.fold) u.searchParams.set('fold', '1'); else u.searchParams.delete('fold');
  if (!S.panel) u.searchParams.set('state', '0'); else u.searchParams.delete('state');
  if (u.href !== location.href) history.replaceState(null, '', u);
}
function fit() {
  const st = document.getElementById('stage'), W = S.fold ? 382 : 951, H = S.fold ? 644 : 669;
  const left = S.panel && innerWidth >= 1100 ? 290 : 0, aw = innerWidth - left - 32, ah = innerHeight - 70;
  const s = Math.max(.3, Math.min(aw / W, ah / H, 1.6));
  st.style.transform = `scale(${s})`; st.style.left = `${left + 16 + (aw - W * s) / 2}px`; st.style.top = `${12 + (ah - H * s) / 2}px`;
}

// ================= input =================
const stage = document.getElementById('stage');
stage.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !stage.contains(el)) return;
  const a = el.dataset.act, n = el.dataset.n;
  if (a === 'scrim') { if (e.target === el) { S.modal = null; render(); } return; }
  const go = {
    tab: () => { const t = el.dataset.t; if (t === 'canvases' && S.tab === 'canvases' && S.openCanvas) S.openCanvas = null; else S.tab = t; S.placing = null; S.modal = null; render(); },
    toast: () => { toast(el.dataset.msg); render(); },
    theme: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); },
    clearq: () => { if (el.dataset.k === 'aq') S.modal.q = ''; else S.q = ''; S.wantFocus = el.dataset.k; S.resetScroll.push('a', 'b', 'cm'); render(); },
    close: () => { S.modal = null; render(); },
    // A
    openA: () => openA(n),
    againOpen: () => { openCanvas(S.modal.cid); render(); },
    againNew: () => { const num = S.modal.num; S.modal = null; openNewCanvas(num); },
    plotinfo: () => { S.modal = { type:'plotinfo', num:n }; render(); },
    // B
    selB: () => selectB(n),
    vback: () => { S.viewer.full = false; render(); },
    vfull: () => { S.viewer.full = !S.viewer.full; render(); },
    vpg: () => { S.viewer.page += +el.dataset.d; render(); },
    vpn: () => { S.viewer.page = +el.dataset.p; render(); },
    vz: () => { const Z = [1, 1.5, 2, 3, 4, 6], i = Z.indexOf(S.viewer.zoom), d = +el.dataset.d; S.viewer.zoom = d === 0 ? 1 : Z[Math.max(0, Math.min(Z.length - 1, i + d))]; render(); },
    openNewB: () => openNewCanvas(S.sel, undefined, S.viewer.page),
    placeB: () => { S.modal = { type:'pick', num:S.sel }; render(); },
    pickCanvas: () => { const cid = el.dataset.cid, num = S.modal.num, d = D(num); S.modal = null;
      if (cid === 'new') return openNewCanvas(num, undefined, S.viewer.page);
      if (d.k === null) { S.modal = { type:'scale', num, then:'place', cid, k:null }; return render(); }
      startPlacing(cid, num, d.k, S.viewer.page); },
    scaleGo: () => { const m = S.modal; S.modal = null; if (m.then === 'place') startPlacing(m.cid, m.num, m.k, S.viewer.page); else openNewCanvas(m.num, m.k, m.page || 0); },
    bannerView: () => { const num = S.banner.num; S.banner = null; S.tab = 'drawings'; selectB(num); },
    bannerX: () => { S.banner = null; render(); },
    // canvases
    csel: () => { S.listSel = el.dataset.id; render(); },
    copen: () => { openCanvas(el.dataset.id); render(); },
    cback: () => { S.openCanvas = null; S.placing = null; render(); },
    canvasclick: () => { if (!S.placing) return; const p = toCanvas(e); if (p) placeAt(p[0], p[1]); },
    cancelplace: () => { S.placing = null; render(); },
    // C
    addSheet: () => { S.placing = null; S.modal = { type:'add', view:'search', q:'' }; S.wantFocus = 'aq'; render(); },
    pickC: () => pickC(n),
    pageC: () => { S.modal.page = +el.dataset.p; S.modal.view = 'confirm'; const d = D(S.modal.num); if (!S.onDuo.has(d.num) && S.online) { withPDF(d.num, () => {}); return; } render(); },
    cbacksearch: () => { S.modal.view = 'search'; S.wantFocus = 'aq'; render(); },
    cbackgrid: () => { S.modal.view = 'grid'; render(); },
    cfolders: () => { S.modal.view = 'folders'; S.modal.folder = []; render(); },
    mfin: () => { S.modal.folder = [...(S.modal.folder || []), el.dataset.n]; render(); },
    mfup: () => { S.modal.folder = (S.modal.folder || []).slice(0, +el.dataset.i); render(); },
    changeScale: () => { S.modal.change = true; render(); },
    pickscale: () => { S.modal.k = +el.dataset.k; render(); },
    placeC: () => { const m = S.modal, d = D(m.num); const k = m.k != null ? m.k : d.k; S.modal = null; startPlacing(S.openCanvas, m.num, k, m.page || 0); },
    laterC: () => { const m = S.modal; if (!S.pending.some(x => x.num === m.num)) S.pending.push({ num:m.num, cid:S.openCanvas, ready:false }); S.modal = null; toast(`${m.num} is waiting for its plot. The chip in the top bar says when it's ready to place.`); render(); },
    chip: () => { const pe = S.pending.find(x => x.num === n);
      if (pe.ready) { S.pending = S.pending.filter(x => x !== pe); const d = D(n); startPlacing(pe.cid, n, d.k, 0); }
      else { S.modal = { type:'add', view:'confirm', num:n, page:0, q:'' }; render(); } },
    fin: () => { S.folder = [...S.folder, el.dataset.n]; S.resetScroll.push('cf'); render(); },
    fup: () => { S.folder = S.folder.slice(0, +el.dataset.i); render(); },
  }[a];
  if (go) go();
});
stage.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  if (k === 'aq') { S.modal.q = e.target.value; S.resetScroll.push('cm'); } else { S.q = e.target.value; S.resetScroll.push('a', 'b'); }
  render();
});
function toCanvas(e) { const cv = stage.querySelector('svg.cv[data-act]'); if (!cv) return null; const m = cv.getScreenCTM(); if (!m) return null; const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()); return [p.x, p.y]; }
stage.addEventListener('pointermove', e => {
  if (S.placing) { const p = toCanvas(e), g = stage.querySelector('#placing'); if (!p || !g) return; S.placing.at = p; const d = D(S.placing.num), kk = S.placing.k || 1;
    g.setAttribute('transform', `translate(${f(p[0] - d.pw * kk / 2)} ${f(p[1] - d.ph * kk / 2)})`); }
  if (pan && e.buttons) { pan.el.scrollLeft = pan.sl - (e.clientX - pan.x); pan.el.scrollTop = pan.st - (e.clientY - pan.y); }
});
let pan = null;
stage.addEventListener('pointerdown', e => { const el = e.target.closest('[data-pan]'); if (el && S.viewer.zoom > 1) pan = { el, x:e.clientX, y:e.clientY, sl:el.scrollLeft, st:el.scrollTop }; });
addEventListener('pointerup', () => { pan = null; });
stage.addEventListener('wheel', e => { if (!e.ctrlKey || !e.target.closest('[data-pan]')) return; e.preventDefault(); const Z = [1, 1.5, 2, 3, 4, 6], i = Z.indexOf(S.viewer.zoom); S.viewer.zoom = Z[Math.max(0, Math.min(Z.length - 1, i + (e.deltaY < 0 ? 1 : -1)))]; render(); }, { passive:false });

document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const p = b.dataset.p;
  if (p === 'online') S.online = true;
  if (p === 'offline') S.online = false;
  if (p === 'lon') S.laptop = true;
  if (p === 'loff') { if (S.laptop) S.laptopOffAt = Date.now(); S.laptop = false; }
  if (p === 'arrive') { for (const [num, q] of Object.entries(S.plots)) if (q.state !== 'done') arrive(num, true); }
  if (p === 'reset') { resetUI(); }
  reconcile(); render();
  if (S.online) { // back online: fetch a PDF the open viewer or Add sheet is showing as not on this Duo
    const num = S.v === 'B' && S.tab === 'drawings' ? S.sel : S.modal && S.modal.type === 'add' && S.modal.view === 'confirm' ? S.modal.num : null;
    if (num && D(num).files !== 'dwg' && !S.onDuo.has(num) && S.downloading !== num) withPDF(num, () => {});
  }
});
document.getElementById('pclose').onclick = () => { S.panel = false; render(); };
document.getElementById('stateT').onclick = () => { S.panel = !S.panel; render(); };
document.getElementById('themeT').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('foldT').onclick = () => { S.fold = !S.fold; S.placing = null; render(); };
const KEYS = Object.keys(VARIANTS);
function setVariant(v) { S.v = v; resetUI(); render(); }
document.getElementById('prev').onclick = () => setVariant(KEYS[(KEYS.indexOf(S.v) + KEYS.length - 1) % KEYS.length]);
document.getElementById('next').onclick = () => setVariant(KEYS[(KEYS.indexOf(S.v) + 1) % KEYS.length]);
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } return; }
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.placing) S.placing = null; render(); }
});
addEventListener('resize', fit);
setInterval(tick, 250);
render();
</script>
