<!doctype html>
<!--
  PROTOTYPE - throwaway. Never merge to main; kept at the tag prototype/select-tool. Ticket #64.
  Question: what could a Select button on the rail look like, one that picks up any object (a stroke, text box,
  dimension, frame or sheet) with a tap? Three variants of the drafting-rail canvas screen (ADR-0011), unfolded Duo 951 x 669:
    ?v=A  Select beside Lasso: Select taps one thing; the Lasso stays for loops
    ?v=B  One Select tool: tap one thing, or loop round many from empty canvas; no Lasso button
    ?v=C  Select with a box: tap one thing, or drag a box from empty canvas; the Lasso stays for loops
  ?theme=dark for dark, ?state=0 hides the state panel. Arrow keys or the bar at the bottom flip variants.
  Mouse click = tap, mouse drag = a Pencil drag; the wheel pans, Ctrl+wheel or a trackpad pinch zooms. On touch, two
  fingers pan and pinch, or twist a selected sheet. The sheet, its title block and every mark are made up. Nothing is saved.
  Plain HTML, CSS and JS, no dependencies.
-->

<script>
"use strict";
const $=s=>document.querySelector(s),W=951,H=669,cv=$('#cv'),ctx=cv.getContext('2d');
const FONT='-apple-system,system-ui,"SF Pro Text","Segoe UI",sans-serif';
const VARIANTS={A:'Select beside Lasso',B:'One Select tool',C:'Select with a box'};
const params=new URLSearchParams(location.search);
let v=VARIANTS[params.get('v')]?params.get('v'):'A';
let theme=params.get('theme')==='dark'?'dark':'light';
let showState=params.get('state')!=='0';

// ---------- tools, as CanvasTool.swift names and prompts them, plus Select ----------
const ICON={
 pen:'<path d="M4 20l4-1 11-11-3-3L5 16z M14 6l3 3"/>',hl:'<path d="M6 14l7-7 4 4-7 7H6z M4 20h12"/>',eraser:'<path d="M8 19l-4-4 9-9 6 6-7 7z M10 19h10"/>',
 line:'<path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/>',
 select:'<path d="M6.5 3.5v15l4-3.8 2.8 6.2 2.5-1.1-2.8-6.1 5.4-.3z"/>',
 lasso:'<path d="M12 5c5 0 8 2 8 5s-3 5-8 5-8-2-8-5 3-5 8-5z" stroke-dasharray="2.5 2"/><path d="M7 14c-1.5 2 0 4.5 2 5"/>',
 text:'<path d="M5 6h14 M12 6v13 M9 19h6"/>',measure:'<path d="M3 15l12-12 6 6-12 12z M7 11l2 2 M10 8l2 2 M13 5l2 2"/>',
 dim:'<path d="M4 7v10 M20 7v10 M4 12h16 M7 10l-3 2 3 2 M17 10l3 2-3 2"/>',frame:'<rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="M13 15h7.5 M13 15v4"/>',
 window:'<rect x="4" y="5" width="16" height="14" stroke-dasharray="3 2"/>',
 chev:'<path d="M15 6l-6 6 6 6"/>',undo:'<path d="M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-3"/>',redo:'<path d="M15 14l5-5-5-5 M20 9H10a6 6 0 000 12h3"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2 M12 20v2 M4 12H2 M22 12h-2 M5 5l1.5 1.5 M17.5 17.5L19 19 M5 19l1.5-1.5 M17.5 6.5L19 5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M10.3 3h3.4l.5 2.4 1.6.9 2.3-.8 1.7 2.9-1.8 1.6v1.9l1.8 1.6-1.7 2.9-2.3-.8-1.6.9-.5 2.4h-3.4l-.5-2.4-1.6-.9-2.3.8-1.7-2.9 1.8-1.6v-1.9L4.2 8.4l1.7-2.9 2.3.8 1.6-.9z"/>',
 rotL:'<path d="M4 4v5h5"/><path d="M4.6 9A8 8 0 1 1 6 17"/>',rotR:'<path d="M20 4v5h-5"/><path d="M19.4 9A8 8 0 1 0 18 17"/>',
 plus:'<path d="M12 5v14 M5 12h14"/>',rec:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3.5"/>',send:'<path d="M4 12l16-7-6 16-3-7z M11 14l9-9"/>',
 ext:'<path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/>',
 canvases:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15c2-4 5-6 8-7"/>',drawings:'<path d="M7 3h10v14H7z M4 6v15h12"/>',
 jobs:'<path d="M5 12l4 4 10-10"/>',meetings:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0 M12 18v3"/>'};
const svg=n=>`<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;
const NAME={pen:'Pen',hl:'Highlighter',eraser:'Eraser',line:'Line and shape',select:'Select',lasso:'Lasso',text:'Text box',measure:'Measure',dim:'Dimension',frame:'Frame',window:'Window'};
const PROMPT={pen:'Draw with the Pencil',hl:'Highlight with the Pencil',eraser:'Touch ink to erase a stroke',line:'Draw a line, box or circle',lasso:'Loop ink, or tap a sheet',text:'Tap to place a text box',measure:'Measure: tap first point',dim:'Dimension: tap first point',frame:'Drag a box for a frame',window:'Drag a window over a region'};
const SELECT_PROMPT={A:'Tap anything to select it',B:'Tap a thing, or loop round many',C:'Tap a thing, or drag a box round many'};
const LIVE=new Set(['pen','select','lasso']);
const rail=()=>v==='B'?[['pen','hl','eraser','line'],['select','text'],['measure','dim','frame','window']]:[['pen','hl','eraser','line'],['select','lasso','text'],['measure','dim','frame','window']];
const INKS={red:['#cf3027','#ff6b5e'],green:['#1f9d55','#4cd07d'],blue:['#2563eb','#6ea0ff'],black:['#1d1d1f','#e8e6e1']};
const inkCol=k=>INKS[k][theme==='dark'?1:0];

// ---------- the canvas: model space in feet, y down; one sheet, then everything drawn over or beside it ----------
const PW=17,PH=11; // the sheet's paper, inches (ANSI B)
const SCALES=[['1/8" = 1\'-0"',8],['1/4" = 1\'-0"',4],['1/2" = 1\'-0"',2]]; // canvas feet per printed inch
const DIMH=1.3; // a dimension's text height, feet
function dense(list,step=.5){const o=[];for(let i=0;i<list.length-1;i++){const a=list[i],b=list[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let j=0;j<n;j++)o.push({x:a[0]+(b[0]-a[0])*j/n,y:a[1]+(b[1]-a[1])*j/n})}const l=list[list.length-1];o.push({x:l[0],y:l[1]});return o}
function cloud(cx,cy,rx,ry){const p=[];for(let i=0;i<=96;i++){const t=i/96*Math.PI*2,b=1+.075*Math.abs(Math.sin(t*7));p.push({x:cx+rx*b*Math.cos(t),y:cy+ry*b*Math.sin(t)})}return p}
function ring(cx,cy,r){const p=[];for(let i=0;i<=40;i++){const t=i/40*Math.PI*2+.4,q=r*(1+.04*Math.sin(t*3));p.push({x:cx+q*Math.cos(t),y:cy+q*Math.sin(t)})}return p}
function fresh(){let n=0;const id=()=>'k'+(++n);return{next:100,sheet:{cx:0,cy:0,ang:0,f:4},items:[
 {id:id(),kind:'frame',name:'Frame 1',x:37,y:0,w:23,h:17.5},
 {id:id(),kind:'stroke',name:'red cloud',color:'red',w:.22,pts:cloud(-22,-10.8,6.5,5)},
 {id:id(),kind:'stroke',name:'blue arrow',color:'blue',w:.22,pts:dense([[10,-15.5],[4.8,-4.2],[4.2,-7.2],[4.8,-4.2],[7.6,-5.8]])},
 {id:id(),kind:'dim',name:'dimension',color:'blue',a:{x:-30,y:17.2},b:{x:-17.5,y:17.2},off:{x:0,y:2}},
 {id:id(),kind:'text',name:'text box',color:'red',text:'Field verify duct size',x:37.5,y:-17.5,h:1.7},
 {id:id(),kind:'stroke',name:'green check',color:'green',w:.22,pts:dense([[39,-8.4],[41.2,-5.6],[45.8,-11.4]])},
 {id:id(),kind:'stroke',name:'pump sketch',color:'black',w:.18,pts:dense([[41,5.4],[51.2,5],[51,12.2],[41.3,12.5],[41,5.4]])},
 {id:id(),kind:'stroke',name:'pump sketch circle',color:'black',w:.18,pts:ring(55.5,8.8,2.4)}]}}

let doc=fresh(),undoS=[],redoS=[],sel=null,tool='select',ink='red',gesture=null,fingers=new Map(),hint='',hintTimer=0,cursor=null,catchAt=null,penCount=0;
let last='Nothing yet. Select is in hand: tap something.';
let view={ppf:7.8,ox:0,oy:0},K={};
const clone=o=>JSON.parse(JSON.stringify(o));
const push=()=>{undoS.push(clone(doc));redoS=[]};
const byId=id=>doc.items.find(i=>i.id===id);
function put(it){const i=doc.items.findIndex(x=>x.id===it.id);if(i>=0)doc.items[i]=it}
const S=p=>({x:p.x*view.ppf+view.ox,y:p.y*view.ppf+view.oy}),M=p=>({x:(p.x-view.ox)/view.ppf,y:(p.y-view.oy)/view.ppf});

// ---------- geometry ----------
const theta=a=>-a*Math.PI/180; // a sheet's angle reads counter-clockwise, as AutoCAD's do
const rot=(p,c,t)=>{const s=Math.sin(t),k=Math.cos(t),x=p.x-c.x,y=p.y-c.y;return{x:c.x+x*k-y*s,y:c.y+x*s+y*k}};
const norm=a=>((a%360)+360)%360;
function deg(a){a=Math.round(norm(a)*10)/10;if(a>=360)a=0;return a+'°'}
function ftin(f){const neg=f<0;let s=Math.round(Math.abs(f)*12*16),ft=Math.floor(s/192);s-=ft*192;let i=Math.floor(s/16),n=s-i*16,fr='';if(n){let d=16;while(n%2===0){n/=2;d/=2}fr=' '+n+'/'+d}return(neg?'-':'')+ft+"'-"+i+fr+'"'}
function paperToWorld(px,py,s=doc.sheet){return rot({x:s.cx-PW*s.f/2+px*s.f,y:s.cy-PH*s.f/2+py*s.f},{x:s.cx,y:s.cy},theta(s.ang))}
function onSheet(p,s=doc.sheet){const q=rot(p,{x:s.cx,y:s.cy},-theta(s.ang));return Math.abs(q.x-s.cx)<=PW*s.f/2&&Math.abs(q.y-s.cy)<=PH*s.f/2}
const sheetCorners=(s=doc.sheet)=>[[0,0],[PW,0],[PW,PH],[0,PH]].map(([x,y])=>paperToWorld(x,y,s));
const mctx=document.createElement('canvas').getContext('2d');
function textW(it){mctx.font=`600 100px ${FONT}`;return mctx.measureText(it.text).width/100*it.h}
function labelW(t,px,w=600){mctx.font=`${w} ${px}px ${FONT}`;return mctx.measureText(t).width}
