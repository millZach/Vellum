<!doctype html>
<!--
  PROTOTYPE - throwaway. Never merge to main; kept at the tag prototype/symbols.
  Question (#41): reusable symbols on the canvas. Where the library lives and how a symbol gets into it; how one is
  placed and sized on a canvas measured in real-world lengths (ADR-0002); whether a placed copy is plain ink or stays
  linked to the library.

  Three variants on one page, ?v=A|B|C, switched by the bar at the bottom or the arrow keys; ?theme=dark.
   A  A Symbols tool on the rail with a flyout library kept on this Duo. Drawn at a printed size at the scale under the
      tap. A placed copy is plain ink. A bubble's tag is typed as it lands, then it is a text box.
   B  Symbols as a section of the line and shape flyout; the library is Dropbox/Vellum/Symbols, shared with every
      canvas and the laptop. Sized in real-world lengths. A valve turns onto a line and cuts in at its connection ends,
      which stay snap points. A placed copy is ink. A bubble numbers itself.
   C  A Symbols panel; drag a symbol out. Copies stay linked: editing the symbol changes every linked copy; Unlink makes
      a copy plain ink. A bubble's tag belongs to the copy.

  Chrome follows prototype/drawing-tools and prototype/canvas-screen. The sheet, ink and symbols are made up and drawn
  here as simple lines. Plain HTML, CSS and JS, no dependencies, nothing saved.
  Mouse, finger or Pencil uses the tool; the wheel, two fingers or a right-drag pan and zoom.
-->

const ORDER=['A','B','C'];
const VARS={
 A:{name:'Symbols tool on the rail',
  desc:'A <b>Symbols</b> tool joins the rail after line and shape; tap it again for the library, a flyout kept on this Duo for every canvas. Tap a symbol, then tap the canvas. It is drawn at a <b>printed size</b> (a 3/8" bubble, a 1/4" valve) at the scale under the tap, so it looks the same on the paper of any sheet. Once placed it is <b>plain ink</b>, like a snapped shape: lasso it, edit it, and later changes to the symbol never reach it. A bubble asks for its tag as it lands; after that the tag is a text box.',

 B:{name:'Symbols in the line and shape flyout',

 C:{name:'Linked symbols in a panel',

const PENW={Fine:.8,Medium:1.5,Bold:2.6};
